[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Three-tier automated code review system combining static analysis, ML risk priors, and Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PatchPilot Team"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["patchpilot*", "app*", "ml*", "eval*"]
